name: SuperShade Plus release

# Every push to main builds the optimised (R8) APK and publishes it as the latest release, which
# the app's updater offers. All builds share one signing key, so each installs over the last: made
# here once and kept in this repository's Actions cache (never in the repository or a log). The
# weekly upstream check reads it too, so it doesn't expire.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plus-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Look for the cached signing key
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/plus-key
          key: supershade-plus-keystore-v1

      - name: Restore or make the signing key
        run: |
          key="$RUNNER_TEMP/plus-key/plus.keystore"
          if [ ! -s "$key" ]; then
            mkdir -p "$(dirname "$key")"
            keytool -genkeypair -keystore "$key" -storepass supershadeplus -keypass supershadeplus \
              -alias supershadeplus -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SuperShade Plus,O=SuperShade Plus,C=US" > /dev/null 2>&1
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
            echo "Made the signing key; it's kept in the Actions cache from now on."
          fi
          {
            echo "KEYSTORE_PATH=$key"
            echo "KEY_ALIAS=supershadeplus"
            echo "KEY_PASSWORD=supershadeplus"
            echo "STORE_PASSWORD=supershadeplus"
          } >> "$GITHUB_ENV"

      - name: Keep the new signing key
        if: env.NEW_KEY == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/plus-key
          key: supershade-plus-keystore-v1

      - name: Build the optimised APK
        env:
          RUN: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          base=$(sed -nE 's/.*findProperty\("versionName"\) \?: "([^"]+)".*/\1/p' app/build.gradle | head -n 1)
          echo "BASE_VERSION=$base" >> "$GITHUB_ENV"
          ./gradlew :app:assembleRelease --no-daemon \
            "-PversionName=${base}-plus.${RUN}" "-PversionCode=$((200000 + RUN))"

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          tag="v${BASE_VERSION}-plus.${RUN}"
          apk="supershade-plus-${tag}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E -- '-plus\.[0-9]+$' | sort -V | awk 'END { print }')
          since=""
          if [ -n "$previous" ]; then
            since=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$previous" --jq .target_commitish 2> /dev/null || true)
          fi
          if [ -n "$since" ] && git cat-file -e "$since^{commit}" 2> /dev/null && [ "$(git rev-parse "$since")" != "$GITHUB_SHA" ]; then
            changes=$(git log --no-merges --format='- %s' "$since..$GITHUB_SHA" | awk 'NR <= 15')
          fi
          [ -n "${changes:-}" ] || changes=$(git log -1 --format='- %s')
          printf '## Changed\n%s\n\nSigned with the repository'"'"'s shared key, so it installs over the previous SuperShade Plus build.\n' "$changes" > notes.md
          gh release create "$tag" "$apk" "$apk.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SuperShade Plus ${BASE_VERSION} (build ${RUN})" --notes-file notes.md --latest
          # Keep the five newest builds.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E -- '-plus\.[0-9]+$' | sort -V | head -n -5 \
            | while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
